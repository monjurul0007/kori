# Package ecosystems (docker) are added by the PRs that
# introduce their manifests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      scope: api
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      scope: web
    groups:
      npm-deps:
        patterns: ["*"]
