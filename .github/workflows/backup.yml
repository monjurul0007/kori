name: backup

# Nightly encrypted pg_dump to a PRIVATE Google Cloud Storage bucket. Never an Actions artifact:
# artifacts on a public repo are public. Restore steps: docs/deploy.md.

on:
  schedule:
    - cron: "17 20 * * *" # 02:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Install pg_dump 16 and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 age

      # The dump is encrypted to the owner's age public key (BACKUP_AGE_RECIPIENT, not secret).
      # Only the owner holds the private key. Nothing is written to the job summary or logs.
      - name: Dump, encrypt and upload
        env:
          KORI_DATABASE_URL: ${{ secrets.KORI_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_AGE_RECIPIENT" && test -n "$BACKUP_BUCKET"
          pgurl="${KORI_DATABASE_URL/postgresql+psycopg:/postgresql:}"
          name="kori-$(date -u +%Y%m%dT%H%M%SZ).dump.age"
          pg_dump --format=custom --no-owner "$pgurl" | age -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/$name"
          gcloud storage cp "$RUNNER_TEMP/$name" "gs://$BACKUP_BUCKET/$name"
          rm -f "$RUNNER_TEMP/$name"
          echo "Uploaded $name"
