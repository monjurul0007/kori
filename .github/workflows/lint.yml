name: lint

# Stage 1 of ci.yml: pre-commit hooks (lint, format, secret scan).
# Called by ci.yml; it can also be run on its own from the Actions tab.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7 # gitleaks hook builds from Go source
        with:
          go-version: stable
          cache: false

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
