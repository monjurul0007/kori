name: api-ci

on:
  # No path filter on PRs: api-ci is a required check, so it must report on every PR.
  pull_request:
  push:
    branches: [main]
    paths: ["apps/api/**", "openapi.json", "apps/web/src/api/**", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These credentials belong to a throwaway service container that exists only for this job and
    # is unreachable from outside it, so they are not secrets. Service containers cannot read the
    # `env` context, so the values are repeated in KORI_DATABASE_URL below. Real credentials
    # (deploy, production) must come from GitHub secrets, never from this file.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kori
          POSTGRES_PASSWORD: kori
          POSTGRES_DB: kori
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kori -d kori"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KORI_DATABASE_URL: postgresql+psycopg://kori:kori@localhost:5432/kori
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Migrate from a clean database
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Tests
        run: uv run pytest --cov-fail-under=85

      - name: Regenerate OpenAPI spec and web client
        working-directory: .
        run: |
          (cd apps/api && uv run python scripts/export_openapi.py ../../openapi.json)
          (cd apps/web && pnpm install --frozen-lockfile && pnpm gen:api)

      - name: OpenAPI drift check
        working-directory: .
        run: git diff --exit-code openapi.json apps/web/src/api/schema.d.ts
