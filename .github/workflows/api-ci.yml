name: api-ci

on:
  pull_request:
    paths: ["apps/api/**", "openapi.json", "apps/web/src/api/**", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "openapi.json", "apps/web/src/api/**", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov-fail-under=85

      - name: Regenerate OpenAPI spec and web client
        working-directory: .
        run: |
          (cd apps/api && uv run python scripts/export_openapi.py ../../openapi.json)
          (cd apps/web && pnpm install --frozen-lockfile && pnpm gen:api)

      - name: OpenAPI drift check
        working-directory: .
        run: git diff --exit-code openapi.json apps/web/src/api/schema.d.ts
