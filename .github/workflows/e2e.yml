name: e2e

# Stage 3 of ci.yml: Playwright smoke test against the Compose stack (`make up`).
# Called by ci.yml; it can also be run on its own from the Actions tab.
# Playwright against the same Compose stack you run locally with `make up`: a smoke test (log in,
# add an expense, see it on the dashboard) plus axe accessibility and layout checks on every screen.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-only credentials for a throwaway user in a throwaway database. Not secrets.
      E2E_EMAIL: e2e@kori.local
      E2E_PASSWORD: e2e-test-password
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Create the CI user
        # The password is read from stdin twice (prompt and confirmation). -T: no TTY in CI.
        run: |
          printf '%s\n%s\n' "$E2E_PASSWORD" "$E2E_PASSWORD" |
            docker compose exec -T app kori create-user --email "$E2E_EMAIL" --name "E2E"

      # The accessibility and layout specs need a populated app: the Totals list and the transactions
      # toolbar only render with data. The seed is fake and deterministic.
      - name: Fill the CI user with demo data
        run: docker compose exec -T app kori seed --email "$E2E_EMAIL"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: apps/web
        run: pnpm e2e --trace off

      # The report and traces hold test data only (a throwaway user and one E2E expense).
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Show the app logs
        if: failure()
        run: docker compose logs app

      - name: Stop the stack
        if: always()
        run: docker compose down -v
