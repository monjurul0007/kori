services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kori}
      POSTGRES_DB: ${POSTGRES_DB:-kori}
    env_file:
      - path: apps/api/.env
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kori-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kori} -d $${POSTGRES_DB:-kori}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      # The one value that differs inside the stack: the database host is `db`, not localhost.
      # POSTGRES_* come from apps/api/.env (the Makefile passes it as --env-file).
      KORI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kori}:${POSTGRES_PASSWORD:-kori}@db:5432/${POSTGRES_DB:-kori}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  kori-db:
