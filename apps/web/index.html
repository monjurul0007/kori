<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F3A99" />
    <script>
      // Sets the theme before first paint so there is no flash. Keep in step with src/lib/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("kori.theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0E1022" : "#2F3A99");
        } catch (error) {
          // Storage or matchMedia is unavailable: stay on the light default.
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kori" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Kori</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
